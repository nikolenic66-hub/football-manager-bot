name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Find release archives
        id: find_archives
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository root ==="
          pwd

          echo
          echo "=== ZIP files in repository ==="
          find . -type f -name "*.zip" -print | sort

          PART1=""
          PART2=""

          # Preferred names
          if [ -f "./football-manager-bot-release-part-1.zip" ]; then
            PART1="./football-manager-bot-release-part-1.zip"
          elif [ -f "./football-manager-bot-final-fixed-part-1.zip" ]; then
            PART1="./football-manager-bot-final-fixed-part-1.zip"
          fi

          if [ -f "./football-manager-bot-release-part-2.zip" ]; then
            PART2="./football-manager-bot-release-part-2.zip"
          elif [ -f "./football-manager-bot-final-fixed-part-2.zip" ]; then
            PART2="./football-manager-bot-final-fixed-part-2.zip"
          fi

          if [ -z "$PART1" ]; then
            echo
            echo "ERROR: archive part 1 was not found."
            exit 1
          fi

          if [ -z "$PART2" ]; then
            echo
            echo "ERROR: archive part 2 was not found."
            exit 1
          fi

          echo
          echo "=== Selected archives ==="
          echo "Part 1: $PART1"
          echo "Part 2: $PART2"

          ls -lh "$PART1" "$PART2"

          echo "part1=$PART1" >> "$GITHUB_OUTPUT"
          echo "part2=$PART2" >> "$GITHUB_OUTPUT"

      - name: Verify archive sizes
        shell: bash
        run: |
          set -euo pipefail

          PART1="${{ steps.find_archives.outputs.part1 }}"
          PART2="${{ steps.find_archives.outputs.part2 }}"

          SIZE1=$(stat -c%s "$PART1")
          SIZE2=$(stat -c%s "$PART2")

          echo "Part 1: $SIZE1 bytes"
          echo "Part 2: $SIZE2 bytes"

          MAX=$((25 * 1024 * 1024))

          if [ "$SIZE1" -gt "$MAX" ]; then
            echo "ERROR: part 1 is larger than 25 MiB."
            exit 1
          fi

          if [ "$SIZE2" -gt "$MAX" ]; then
            echo "ERROR: part 2 is larger than 25 MiB."
            exit 1
          fi

          echo "Archive size check OK."

      - name: Extract release archives
        shell: bash
        run: |
          set -euo pipefail

          PART1="${{ steps.find_archives.outputs.part1 }}"
          PART2="${{ steps.find_archives.outputs.part2 }}"

          rm -rf extracted
          mkdir -p extracted

          unzip -oq "$PART1" -d extracted
          unzip -oq "$PART2" -d extracted

          echo
          echo "Archives extracted successfully."

      - name: Validate release structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "app/__init__.py"
            "app/bot.py"
            "app/config.py"
            "app/db.py"
            "app/repositories.py"
            "app/services.py"
            "app/live_worker.py"
            "app/game/engine.py"
            "app/game/ratings.py"
            "requirements.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "extracted/$file" ]; then
              echo "ERROR: missing required file: $file"
              exit 1
            fi
          done

          echo "Release structure OK."

      - name: Replace project files
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "extracted" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          cp -a extracted/. .

          rm -rf extracted

          echo "Project files replaced with verified release."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q app scripts

          echo "Python compilation OK."

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          pytest -q

      - name: Remove release archives
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            football-manager-bot-release-part-1.zip \
            football-manager-bot-release-part-2.zip \
            football-manager-bot-final-fixed-part-1.zip \
            football-manager-bot-final-fixed-part-2.zip

          echo "Release archives removed from final source tree."

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy verified football manager release"
          fi

      - name: Push verified release
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo
          echo "========================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "========================================"
