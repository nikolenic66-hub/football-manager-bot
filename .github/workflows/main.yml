name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project archives
        run: |
          set -e

          echo "ZIP files in repository:"
          find . -maxdepth 1 -type f -name "*.zip" -print

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name "*.zip" | sort)

          if [ "${#ZIPS[@]}" -ne 3 ]; then
            echo "ERROR: Expected exactly 3 ZIP archives."
            echo "Found: ${#ZIPS[@]}"
            exit 1
          fi

          echo "Found 3 archives:"
          printf '%s\n' "${ZIPS[@]}"

          echo "ZIP1=${ZIPS[0]}" >> "$GITHUB_ENV"
          echo "ZIP2=${ZIPS[1]}" >> "$GITHUB_ENV"
          echo "ZIP3=${ZIPS[2]}" >> "$GITHUB_ENV"

      - name: Extract project archives
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          echo "Extracting:"
          echo "$ZIP1"
          echo "$ZIP2"
          echo "$ZIP3"

          unzip -q "$ZIP1" -d extracted
          unzip -q "$ZIP2" -d extracted
          unzip -q "$ZIP3" -d extracted

          echo "Archives extracted successfully."

      - name: Validate project structure
        run: |
          set -e

          test -f extracted/app/__init__.py
          test -f extracted/app/bot.py
          test -f extracted/app/services.py
          test -f extracted/app/live_worker.py
          test -f extracted/app/game/engine.py
          test -f extracted/requirements.txt

          echo "Project structure OK."

      - name: Replace repository files
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "extracted" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          cp -a extracted/. .

          rm -rf extracted

          rm -f "$ZIP1" "$ZIP2" "$ZIP3"

          echo "Project files replaced."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Compile Python
        run: |
          python -m compileall -q app scripts

      - name: Run tests
        run: |
          pytest -q

      - name: Check git status
        run: |
          git status --short

      - name: Commit rebuilt project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy rebuilt project"
          fi

      - name: Push changes
        run: |
          git push
