name: Unpack football manager project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check archive parts
        run: |
          test -f football-manager-bot-memory-optimized-part-1.zip
          test -f football-manager-bot-memory-optimized-part-2.zip
          test -f football-manager-bot-memory-optimized-part-3.zip

          echo "All three archive parts found."

      - name: Unpack project parts
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q football-manager-bot-memory-optimized-part-1.zip -d extracted
          unzip -q football-manager-bot-memory-optimized-part-2.zip -d extracted
          unzip -q football-manager-bot-memory-optimized-part-3.zip -d extracted

          echo "All archive parts unpacked."

      - name: Check restored project
        run: |
          test -d extracted/app
          test -d extracted/tests
          test -d extracted/assets
          test -d extracted/migrations
          test -f extracted/requirements.txt
          test -f extracted/Dockerfile
          test -f extracted/docker-compose.yml

          echo "Project structure verified."

          echo "Total files:"
          find extracted -type f | wc -l

          echo "Asset files:"
          find extracted/assets -type f | wc -l

      - name: Replace old project files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'football-manager-bot-memory-optimized-part-1.zip' \
            ! -name 'football-manager-bot-memory-optimized-part-2.zip' \
            ! -name 'football-manager-bot-memory-optimized-part-3.zip' \
            ! -name 'extracted' \
            -exec rm -rf {} +

          cp -a extracted/. .

      - name: Remove archive parts
        run: |
          rm -f football-manager-bot-memory-optimized-part-1.zip
          rm -f football-manager-bot-memory-optimized-part-2.zip
          rm -f football-manager-bot-memory-optimized-part-3.zip

          rm -rf extracted

      - name: Final project check
        run: |
          test -d app
          test -d tests
          test -d assets
          test -d migrations
          test -f requirements.txt
          test -f Dockerfile
          test -f docker-compose.yml

          echo "Final project structure:"
          find . -maxdepth 2 -type f | sort | head -200

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m compileall -q app tests scripts

      - name: Run tests
        run: |
          pytest -q

      - name: Save unpacked project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Optimize football manager memory usage"
          git push
