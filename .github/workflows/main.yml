name: Validate and promote release archives

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - '*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U football -d football_manager_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      BOT_TOKEN: "123456789:CI_TEST_TOKEN_PLACEHOLDER"
      DATABASE_URL: postgresql+asyncpg://football:football@127.0.0.1:5432/football_manager_test
      TEST_DATABASE_URL: postgresql+asyncpg://football:football@127.0.0.1:5432/football_manager_test
      FMB_RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(./*.zip)

          if [ ${#archives[@]} -eq 0 ]; then
            echo "No release archives found — nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

          ls -lh "${archives[@]}"

      - name: Extract release
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/football-extracted
          mkdir -p /tmp/football-extracted

          for p in ./*.zip; do
            echo "Extracting: $p"
            unzip -oq "$p" -d "/tmp/football-extracted"
          done

      - name: Find project
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r bot; do
            PROJECT="$(dirname "$(dirname "$bot")")"
            break
          done < <(find /tmp/football-extracted -type f -path '*/app/bot.py')

          test -n "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          test -f "$PROJECT/app/bot.py"
          test -f "$PROJECT/app/config.py"
          test -f "$PROJECT/app/db.py"
          test -f "$PROJECT/requirements.txt"

          echo "Project: $PROJECT"

      - name: Setup Python
        if: env.SKIP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP != '1'
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "greenlet>=3.0"
          pip install pytest

      - name: Compile
        if: env.SKIP != '1'
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m compileall -q app

      - name: Prepare PostgreSQL schema for DB regression tests
        if: env.SKIP != '1'
        working-directory: ${{ env.PROJECT }}
        run: |
          python -c "import asyncio; from app.db import init_db; asyncio.run(init_db())"
          python -m app.seed

      - name: Tests
        if: env.SKIP != '1'
        working-directory: ${{ env.PROJECT }}
        run: |
          pytest -q

      - name: Prepare project in temp
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/final-football-project
          mkdir -p /tmp/final-football-project

          cp -a "$PROJECT"/. /tmp/final-football-project/

      - name: Replace repo contents
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a /tmp/final-football-project/. .

          rm -f ./*.zip

          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete

      - name: Commit deployment
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not allow the workflow file from the release archive
          # to overwrite the workflow that is currently running.
          git restore \
            --source=HEAD \
            --staged \
            --worktree \
            .github/workflows \
            2>/dev/null || true

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Deploy from release archives [skip ci]"

      - name: Sync with main
        if: env.SKIP != '1' && env.SKIP_COMMIT != '1'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          echo "=== HEAD before merge ==="
          git --no-pager log --oneline -5

          echo "=== status before merge ==="
          git status --short

          # IMPORTANT:
          # Do NOT use rebase here.
          #
          # The deployment is already committed. Merge the current
          # origin/main into that deployment commit instead.
          git merge origin/main --no-edit

          echo "=== status after merge ==="
          git status --short

          echo "=== HEAD after merge ==="
          git --no-pager log --oneline -5

      - name: Push to main
        if: env.SKIP != '1' && env.SKIP_COMMIT != '1'
        shell: bash
        run: |
          set -euo pipefail

          for i in 1 2 3; do
            echo "Push attempt $i..."

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            if [ "$i" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            echo "Push failed. Fetching latest main..."

            git fetch origin main

            echo "Merging latest origin/main..."

            git merge origin/main --no-edit

            sleep 5
          done
