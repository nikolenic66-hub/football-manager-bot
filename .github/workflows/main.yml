name: Validate and promote release archives

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - '**.py'
      - '**.sql'
      - 'requirements*.txt'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U football -d football_manager_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      BOT_TOKEN: "123456789:CI_TEST_TOKEN_PLACEHOLDER"
      DATABASE_URL: postgresql+asyncpg://football:football@127.0.0.1:5432/football_manager_test
      TEST_DATABASE_URL: postgresql+asyncpg://football:football@127.0.0.1:5432/football_manager_test
      FMB_RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "greenlet>=3.0"
          pip install pytest

      - name: Verify db.py
        run: |
          set -euo pipefail

          test -f app/db.py

          if grep -n "sync_sql" app/db.py; then
            echo "ERROR: old sync_sql block is still present in app/db.py"
            exit 1
          fi

          if grep -n "setval" app/db.py; then
            echo "ERROR: old sequence sync block is still present in app/db.py"
            exit 1
          fi

          echo "app/db.py is the corrected version."

      - name: Compile
        run: |
          python -m compileall -q app

      - name: Prepare PostgreSQL schema
        run: |
          python -c "import asyncio; from app.db import init_db; asyncio.run(init_db())"

      - name: Seed database
        run: |
          python -m app.seed

      - name: Tests
        run: |
          pytest -q

      - name: Check release archives
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          archives=(./*.zip)

          if [ ${#archives[@]} -eq 0 ]; then
            echo "No release archives found."
            exit 0
          fi

          ls -lh "${archives[@]}"

      - name: Commit current repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Validate current release [skip ci]"

      - name: Sync with main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git merge origin/main --no-edit

      - name: Push to main
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main
