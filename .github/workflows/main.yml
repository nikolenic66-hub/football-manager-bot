name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -oq football-manager-bot-release-part-1.zip -d extracted
          unzip -oq football-manager-bot-release-part-2.zip -d extracted

      - name: Find project
        run: |
          set -e

          if [ -f extracted/app/bot.py ]; then
            echo "PROJECT=extracted" >> "$GITHUB_ENV"
            exit 0
          fi

          ROOT=$(find extracted -type f -path "*/app/bot.py" -print -quit | xargs -r dirname | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: app/bot.py not found"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT=$ROOT" >> "$GITHUB_ENV"

      - name: Replace project
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "extracted" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          cp -a "$PROJECT"/. .

          rm -rf extracted

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Compile
        run: |
          python -m compileall -q app

      - name: Test
        run: |
          pytest -q

      - name: Remove ZIP files
        run: |
          rm -f \
            football-manager-bot-release-part-1.zip \
            football-manager-bot-release-part-2.zip

      - name: Commit project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Никогда не коммитим и не изменяем workflow-файлы.
          git restore --staged .github/workflows 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Deploy release [skip ci]"

      - name: Push
        run: |
          git push origin HEAD:main
