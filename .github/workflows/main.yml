name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check release archives
        run: |
          set -euo pipefail

          test -f football-manager-bot-release-part-1.zip
          test -f football-manager-bot-release-part-2.zip

          echo "Release archives found:"
          ls -lh football-manager-bot-release-part-*.zip

      - name: Extract release archives
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -oq football-manager-bot-release-part-1.zip -d extracted
          unzip -oq football-manager-bot-release-part-2.zip -d extracted

          echo "Archives extracted successfully."

      - name: Validate release structure
        run: |
          set -euo pipefail

          test -f extracted/app/__init__.py
          test -f extracted/app/bot.py
          test -f extracted/app/services.py
          test -f extracted/app/live_worker.py
          test -f extracted/app/repositories.py
          test -f extracted/app/game/engine.py
          test -f extracted/app/game/ratings.py

          test -f extracted/app/db.py
          test -f extracted/app/config.py

          test -f extracted/migrations/001_initial.sql
          test -f extracted/migrations/012_concurrency_and_indexes.sql
          test -f extracted/migrations/013_match_player_stats.sql

          test -f extracted/requirements.txt

          echo "Release structure OK."

      - name: Replace repository project files
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "extracted" \
            ! -name "football-manager-bot-release-part-1.zip" \
            ! -name "football-manager-bot-release-part-2.zip" \
            -exec rm -rf {} +

          cp -a extracted/. .

          rm -rf extracted

          echo "Repository project files replaced."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Compile Python
        run: |
          set -euo pipefail

          python -m compileall -q app scripts

          echo "Python compilation OK."

      - name: Run tests
        run: |
          set -euo pipefail

          pytest -q

      - name: Remove release archives from repository
        run: |
          set -euo pipefail

          rm -f football-manager-bot-release-part-1.zip
          rm -f football-manager-bot-release-part-2.zip

          echo "Release archives removed from deployed source tree."

      - name: Commit rebuilt project
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes detected."
          else
            git commit -m "Deploy verified release"
          fi

      - name: Push rebuilt project
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo "Project successfully pushed to main."
