name: Validate and promote release archives

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U football -d football_manager_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      BOT_TOKEN: "123456789:CI_TEST_TOKEN_PLACEHOLDER"
      DATABASE_URL: postgresql+asyncpg://football:football@127.0.0.1:5432/football_manager_test
      TEST_DATABASE_URL: postgresql+asyncpg://football:football@127.0.0.1:5432/football_manager_test
      FMB_RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(./*.zip)

          if [ ${#archives[@]} -eq 0 ]; then
            echo "No release archives found."
            exit 1
          fi

          echo "Release archives:"
          ls -lh "${archives[@]}"

      - name: Extract release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/football-extracted
          mkdir -p /tmp/football-extracted

          for archive in ./*.zip; do
            echo "Extracting: $archive"
            unzip -oq "$archive" -d /tmp/football-extracted
          done

      - name: Find project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r bot; do
            PROJECT="$(dirname "$(dirname "$bot")")"
            break
          done < <(
            find /tmp/football-extracted \
              -type f \
              -path '*/app/bot.py' \
              -print
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: app/bot.py was not found in release archives."
            find /tmp/football-extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          test -f "$PROJECT/app/bot.py"
          test -f "$PROJECT/app/config.py"
          test -f "$PROJECT/app/db.py"
          test -f "$PROJECT/requirements.txt"

          echo "Project found:"
          echo "$PROJECT"

      - name: Verify database code
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking app/db.py..."

          if grep -n "sync_sql" app/db.py; then
            echo "ERROR: old sync_sql block found in release app/db.py"
            exit 1
          fi

          if grep -n "setval" app/db.py; then
            echo "ERROR: old sequence synchronization block found in release app/db.py"
            exit 1
          fi

          echo "Database code is OK."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "greenlet>=3.0"
          pip install pytest

      - name: Compile
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m compileall -q app

      - name: Prepare PostgreSQL schema
        working-directory: ${{ env.PROJECT }}
        run: |
          python -c "import asyncio; from app.db import init_db; asyncio.run(init_db())"

      - name: Seed database
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m app.seed

      - name: Tests
        working-directory: ${{ env.PROJECT }}
        run: |
          pytest -q

      - name: Prepare project for deployment
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/final-football-project
          mkdir -p /tmp/final-football-project

          cp -a "$PROJECT"/. /tmp/final-football-project/

          find /tmp/final-football-project \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find /tmp/final-football-project \
            -type f \
            -name "*.pyc" \
            -delete

          rm -rf /tmp/final-football-project/.pytest_cache

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          cp -a /tmp/final-football-project/. .

          rm -f
