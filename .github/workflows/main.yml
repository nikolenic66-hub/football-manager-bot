name: Unpack release archives

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check archives
        shell: bash
        run: |
          shopt -s nullglob
          archives=(./*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No ZIP archives found. Nothing to do."
            exit 0
          fi
          ls -lh "${archives[@]}"

      - name: Extract archives
        shell: bash
        run: |
          mkdir -p /tmp/extracted
          for p in ./*.zip; do
            unzip -oq "$p" -d "/tmp/extracted"
          done
          ls -la /tmp/extracted

      - name: Find project root
        shell: bash
        run: |
          PROJECT=""
          while IFS= read -r bot; do
            PROJECT="$(dirname "$(dirname "$bot")")"
            break
          done < <(find /tmp/extracted -type f -path '*/app/bot.py')
          if [ -z "$PROJECT" ]; then
            echo "app/bot.py not found in archive"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Replace repo contents
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +
          cp -a "$PROJECT"/. .
          rm -f ./*.zip

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Deploy from release archives [skip ci]"

      - name: Push
        shell: bash
        run: |
          git push origin HEAD:main
