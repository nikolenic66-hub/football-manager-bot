name: Deploy from release archives

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U football -d football_manager_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      BOT_TOKEN: "123456789:CI_TEST_TOKEN_PLACEHOLDER"
      DATABASE_URL: postgresql+asyncpg://football:football@127.0.0.1:5432/football_manager_test
      TEST_DATABASE_URL: postgresql+asyncpg://football:football@127.0.0.1:5432/football_manager_test
      FMB_RUN_DB_TESTS: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Find release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(./*.zip)

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP archives found in repository root."
            exit 1
          fi

          echo "Release archives:"
          printf '  %s\n' "${archives[@]}"

      - name: Extract archives
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/football-extracted
          mkdir -p /tmp/football-extracted

          mapfile -t archives < <(
            find . \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -printf '%f\n' |
            sort
          )

          echo "Extraction order:"
          printf '  %s\n' "${archives[@]}"

          for archive in "${archives[@]}"; do
            echo "Extracting ${archive}"

            python - "$archive" /tmp/football-extracted <<'PY'
import pathlib
import sys
import zipfile

archive = pathlib.Path(sys.argv[1])
destination = pathlib.Path(sys.argv[2]).resolve()

with zipfile.ZipFile(archive) as zf:
    for member in zf.infolist():
        target = (destination / member.filename).resolve()

        if target != destination and destination not in target.parents:
            raise SystemExit(
                f"ERROR: Unsafe ZIP path in {archive}: {member.filename}"
            )

    zf.extractall(destination)
PY
          done

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t candidates < <(
            find /tmp/football-extracted \
              -type f \
              -path '*/app/bot.py' \
              -printf '%h\n' |
            sed 's#/app$##' |
            sort -u
          )

          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one extracted project."
            echo "Found:"
            printf '  %s\n' "${candidates[@]}"
            exit 1
          fi

          PROJECT="${candidates[0]}"

          for required in \
            app/bot.py \
            app/config.py \
            app/db.py \
            requirements.txt
          do
            if [ ! -f "$PROJECT/$required" ]; then
              echo "ERROR: Missing $required"
              exit 1
            fi
          done

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Protect deployment workflow
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$PROJECT/.github"
          cp -a .github "$PROJECT/.github"

      - name: Validate database runner
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          if grep -nE 'sync_sql|setval|IndeterminateDatatype' app/db.py; then
            echo "ERROR: Forbidden legacy sequence-sync code detected in app/db.py"
            exit 1
          fi

          echo "Database runner validation passed."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "greenlet>=3.0"
          pip install "pytest>=8.4,<9" "pytest-asyncio>=1.2,<2"

      - name: Compile
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m compileall -q app

      - name: Initialize database
        working-directory: ${{ env.PROJECT }}
        run: |
          python -c "import asyncio; from app.db import init_db; asyncio.run(init_db())"

      - name: Seed database
        working-directory: ${{ env.PROJECT }}
        run: |
          python -m app.seed

      - name: Tests
        working-directory: ${{ env.PROJECT }}
        run: |
          pytest -q

      - name: Prepare deployed project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/final-football-project
          mkdir -p /tmp/final-football-project

          cp -a "$PROJECT"/. /tmp/final-football-project/

          find /tmp/final-football-project \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find /tmp/final-football-project \
            -type f \
            -name "*.pyc" \
            -delete

          rm -rf /tmp/final-football-project/.pytest_cache

          find /tmp/final-football-project \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -delete

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          cp -a /tmp/final-football-project/. .

          rm -rf .github
          git checkout -- .github

          rm -f ./*.zip

          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          rm -rf .pytest_cache

      - name: Commit deployment
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to deploy."
            echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Deploy from release archives [skip ci]"

      - name: Sync with main
        if: env.SKIP_COMMIT != '1'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git merge origin/main --no-edit

      - name: Push deployment
        if: env.SKIP_COMMIT != '1'
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main
