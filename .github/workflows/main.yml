- name: Commit and rebase
  shell: bash
  run: |
    set -euo pipefail

    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add -A
    git restore --staged .github/workflows 2>/dev/null || true

    if git diff --cached --quiet; then
      echo "Nothing to commit."
      echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
      exit 0
    fi

    git commit -m "Deploy from release archives [skip ci]"

    git fetch origin main
    git rebase origin/main

- name: Push
  if: env.SKIP_COMMIT != '1'
  shell: bash
  run: |
    set -euo pipefail

    for i in 1 2 3; do
      if git push origin HEAD:main; then
        echo "Push succeeded."
        exit 0
      fi

      echo "Push failed (attempt $i), syncing and retrying..."

      git fetch origin main
      git rebase origin/main || {
        echo "Rebase conflict, aborting."
        exit 1
      }
      sleep 5
    done

    echo "Push failed after 3 attempts."
    exit 1
