name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check archive files
        run: |
          set -e

          test -f football-manager-bot-memory-optimized-fixed-part-1.zip
          test -f football-manager-bot-memory-optimized-fixed-part-2.zip
          test -f football-manager-bot-memory-optimized-fixed-part-3.zip

          echo "All project archives found."

      - name: Extract project archives
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -oq football-manager-bot-memory-optimized-fixed-part-1.zip -d extracted
          unzip -oq football-manager-bot-memory-optimized-fixed-part-2.zip -d extracted
          unzip -oq football-manager-bot-memory-optimized-fixed-part-3.zip -d extracted

          echo "Archives extracted successfully."

      - name: Validate project structure
        run: |
          set -e

          test -f extracted/app/__init__.py
          test -f extracted/app/bot.py
          test -f extracted/app/services.py
          test -f extracted/app/live_worker.py
          test -f extracted/app/game/engine.py
          test -f extracted/requirements.txt

          echo "Project structure OK."

      - name: Replace repository files
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "extracted" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          cp -a extracted/. .

          rm -rf extracted

          rm -f \
            football-manager-bot-memory-optimized-fixed-part-1.zip \
            football-manager-bot-memory-optimized-fixed-part-2.zip \
            football-manager-bot-memory-optimized-fixed-part-3.zip

          echo "Project files replaced."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Compile Python
        run: |
          python -m compileall -q app scripts

      - name: Run tests
        run: |
          pytest -q

      - name: Check git status
        run: |
          git status --short

      - name: Commit rebuilt project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy rebuilt project"
          fi

      - name: Push changes
        run: |
          git push origin HEAD:main
